<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" id="hoodie-side-character" role="img" aria-labelledby="title desc">
  <title id="title">Hoodie character — curved side-view artwork revision</title>
  <desc id="desc">Right-facing editable profile, rebuilt against the approved side reference. Separate near and far limb chains; rounded clothing, swept hair, profile face and curled hands.</desc>
