      .hair {fill:#403c32}
      .sole {fill:#b6cdd0}
      .lace {fill:none;stroke:#c5d8d9;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .ref-outline {stroke:#292b25;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .ref-line {fill:none;stroke:#292b25;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
