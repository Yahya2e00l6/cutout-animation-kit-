      <feMorphology in="SourceAlpha" operator="dilate" radius="1.8" result="edge"/>
      <feFlood flood-color="#292b25" result="ink"/>
      <feComposite in="ink" in2="edge" operator="in" result="border"/>
      <feMerge><feMergeNode in="border"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
