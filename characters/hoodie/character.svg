<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" id="hoodie-character" role="img" aria-labelledby="title desc">
  <title id="title">Hoodie character — editable cutout prototype v3</title>
  <desc id="desc">Vector reconstruction of lastpic.jpeg. Nested groups rotate around local origins. Left and right refer to the character's own sides. Hidden facial states are editable vector groups.</desc>
  <defs>
    <!-- Outline inward so existing hand, cuff and shoe strokes are not expanded. -->
    <filter id="limb-outline" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="erode" radius="3" result="interior"/>
      <feComposite in="SourceAlpha" in2="interior" operator="out" result="edge"/>
      <feFlood flood-color="#252722" result="ink"/>
      <feComposite in="ink" in2="edge" operator="in" result="border"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="border"/></feMerge>
    </filter>
    <g id="neutral-features">
      <path fill="#fffdf6" class="outline" stroke-width="2" d="M-44-10Q-29-20-13-9 Q-20 8-35 4 Q-43 1-44-10Z M17-9Q33-19 48-7 Q44 6 30 5 Q20 4 17-9Z"/>
      <ellipse cx="-28" cy="-8" rx="6.5" ry="8" fill="#292c2a"/>
      <ellipse cx="33" cy="-7" rx="6.5" ry="8" fill="#292c2a"/>
      <path class="hair outline" stroke-width="2" d="M-49-27Q-30-42-12-31 L-10-24Q-29-28-49-23Z M16-29Q34-37 48-26 L49-20Q33-25 16-22Z"/>
      <path class="line" d="M7-14 L9 12Q18 20 5 24"/>
    </g>
    <style>
      .outline {stroke:#252722;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .cloth {fill:#85886a}
      .rib {fill:#74795c}
      .skin {fill:#dfbd94}
      .pants {fill:#596666}
      .sole {fill:#aec5c8}
      .hair {fill:#403e33}
      .line {fill:none;stroke:#252722;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
